name: goreecloud-manager

services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goreecloud-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
    ports:
      # Development-only loopback binding. Production publication will use the
      # approved private Caddy/Docker network path instead of a public host port.
      - "127.0.0.1:${GOREECLOUD_MANAGER_PORT:-8090}:8000"
    volumes:
      - manager-data:/app/data
      # Kopia remains external to Manager. Only the sanitized collector output is
      # mounted, and the Manager container receives it read-only. VPS deployments
      # override this host path in .env; local development uses ./runtime/kopia.
      - "${KOPIA_STATUS_HOST_DIR:-./runtime/kopia}:/app/integrations/kopia:ro"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn goreecloud_manager.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - manager-internal
      # Read-only internet/API integrations use a general egress path without
      # publishing the Manager backend.
      - manager-egress
      # Healthchecks is reached directly over a dedicated cross-stack service
      # network. Manager does not join Healthchecks' application/database network.
      - manager-healthchecks
      # Uptime Kuma metrics are reached over a separate dedicated service network.
      # Manager receives no access to Uptime Kuma's data volume or management API.
      - manager-uptime

networks:
  manager-internal:
    driver: bridge
    internal: true
  manager-egress:
    driver: bridge
  manager-healthchecks:
    external: true
    name: manager-healthchecks
  manager-uptime:
    external: true
    name: manager-uptime

volumes:
  manager-data:
