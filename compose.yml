name: goreecloud-manager

services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goreecloud-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
    ports:
      # Development-only loopback binding. Production publication will use the
      # approved private Caddy/Docker network path instead of a public host port.
      - "127.0.0.1:${GOREECLOUD_MANAGER_PORT:-8090}:8000"
    volumes:
      - manager-data:/app/data
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn goreecloud_manager.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - manager-internal
      # The NetBird REST adapter requires outbound HTTPS. This egress network does
      # not publish the Manager backend; the only host binding remains loopback.
      - manager-egress

networks:
  manager-internal:
    driver: bridge
    internal: true
  manager-egress:
    driver: bridge

volumes:
  manager-data:
