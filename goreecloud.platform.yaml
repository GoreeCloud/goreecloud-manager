schema_version: "0.2"

component:
  type: application
  id: goreecloud-manager
  product_name: GoreeCloud Manager
  repository: GoreeCloud/goreecloud-manager

lifecycle: development
version: 0.1.0-dev

supported_platforms:
  - web

api:
  versions: []
  endpoints:
    - name: health
      url: /healthz/
      purpose: Public process-liveness signal; not a production-readiness verdict.
    - name: readiness
      url: /readyz/
      purpose: Database-aware readiness signal kept separate from process liveness.
    - name: tasks-integration-health
      url: /healthz/integrations/tasks/
      purpose: Sanitized GoreeCloud Tasks integration monitoring signal.

platform_systems:
  manager:
    result: not-applicable-justified
    version: 0.1.0-dev
    evidence:
      - README.md
      - docs/project-specification.md
    notes: This repository implements the GoreeCloud Manager authority itself; a separate Manager-to-Manager integration is not applicable.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - core/privacy_views.py
      - integrations/privacy_shield.py
    notes: A sanitized read-only status contract and authenticated surface exist, but current Privacy Shield runtime acceptance and production evidence remain incomplete.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: []
    notes: No accepted Wardveil Security runtime integration is established by the current Manager source baseline.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - integrations/everkeep.py
      - docs/project-specification.md
    notes: Manager has bounded Everkeep resilience-status integration and disposable recovery evidence, while target-environment recovery and production acceptance remain outstanding.
  glaze_ui:
    result: applicable-migration-required
    version: 1.3.0
    evidence:
      - docs/glaze-ui.md
      - core/static/core/css/glaze-ui.css
    notes: Repository source documents an older Manager-specific Glaze UI baseline; migration and application-specific acceptance against current Stable GLAZE UI V1.1 / 1.1.0 remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - integrations/mesh.py
      - docs/platform-overview.md
      - tests/test_mesh.py
      - tests/test_platform_view.py
    notes: A bounded read-only Platform Registry consumer is implemented at source level and fail-closed against Platform Contract v0.2 records, but accepted GoreeCloud Identity credentials, live Mesh publication, network-path acceptance, and production runtime evidence remain incomplete.
    capabilities:
      - platform-registry-read
    dependencies:
      - goreecloud-mesh
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Manager currently uses its local Django authentication/session foundation; accepted GoreeCloud Identity adoption remains a separate platform migration.

health:
  health_endpoint: /healthz/
  readiness_endpoint: /readyz/

continuity:
  backup:
    required: true
    requirements:
      - Protect Manager persistent application state and non-reproducible configuration before production dependency.
      - Keep reusable secrets outside ordinary unapproved backup content while preserving approved recovery references.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of Manager state, authentication, health, and required read-only integrations before production acceptance.
  export:
    required: true
    requirements:
      - Preserve an independently usable export or recovery path for Manager-owned durable state where applicable.
  portability:
    required: true
    requirements:
      - Keep Manager deployment and durable state reproducible without making Manager the sole source of recovery knowledge.

external_dependencies:
  - name: Django 5.2 LTS
    purpose: Server-side application, authentication, sessions, ORM, migrations, and templates.
    required: true
  - name: SQLite
    purpose: Development and initial-MVP Manager-owned application state.
    required: true

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - docs/project-specification.md
    - docs/glaze-ui.md
    - docs/platform-overview.md
    - core/urls.py
    - integrations/privacy_shield.py
    - integrations/everkeep.py
    - integrations/mesh.py
    - tests/test_mesh.py
    - tests/test_platform_view.py
  blockers:
    - GoreeCloud Manager is still in Development and is not approved for production publication.
    - GoreeCloud Mesh source integration exists, but accepted Identity credentials, live registry publication, target network acceptance, and production evidence remain incomplete.
    - GoreeCloud Identity integration remains blocked pending implementation and acceptance.
    - Wardveil Security runtime integration and acceptance remain outstanding.
    - Current Stable GLAZE UI V1.1 / 1.1.0 migration and rendered application acceptance remain outstanding.
    - Full target-environment backup, restore, publication, and production-readiness acceptance remain outstanding.
    - Required Stable acceptance-test and published release evidence has not been produced.
