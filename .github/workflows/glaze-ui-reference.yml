name: Glaze UI Reference

on:
  pull_request:
    paths:
      - 'glaze-ui/**'
      - '.github/workflows/glaze-ui-reference.yml'
  push:
    branches: [main]
    paths:
      - 'glaze-ui/**'
      - '.github/workflows/glaze-ui-reference.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate Glaze UI package
        run: python3 glaze-ui/scripts/validate_glaze_ui.py
