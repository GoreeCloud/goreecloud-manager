name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MANAGER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MANAGER_SECURITY_IMAGE: goreecloud-manager-security:${{ github.event.pull_request.head.sha || github.sha }}
      BUILDKIT_IMAGE: "moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec"
      TRIVY_VERSION: "0.74.0"
      TRIVY_LINUX_AMD64_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            desktop-client/requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate Python dependency SBOM
        run: |
          mkdir -p security-artifacts
          python scripts/python_supply_chain_security.py sbom \
            --lock requirements.lock \
            --output security-artifacts/goreecloud-manager-python.cdx.json \
            --source-revision "$MANAGER_SOURCE_REVISION"

      - name: Scan locked Python dependencies with OSV
        id: osv_scan
        continue-on-error: true
        run: |
          python scripts/python_supply_chain_security.py scan \
            --lock requirements.lock \
            --policy security/osv-policy.json \
            --output security-artifacts/osv-python-vulnerabilities.json \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --timeout-seconds 10 \
            --attempts 2

      - name: Install checksum-pinned Trivy
        id: trivy_install
        continue-on-error: true
        run: |
          archive="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          install_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$install_dir"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 180 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_LINUX_AMD64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir" trivy
          "$install_dir/trivy" --version
          echo "TRIVY_BIN=$install_dir/trivy" >> "$GITHUB_ENV"

      - name: Build exact Manager image and OCI layout together
        id: security_image
        continue-on-error: true
        run: |
          builder_name="manager-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          oci_archive="$RUNNER_TEMP/goreecloud-manager-${MANAGER_SOURCE_REVISION}.oci.tar"
          cleanup() {
            docker buildx rm --force "$builder_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker buildx create \
            --name "$builder_name" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use
          docker buildx inspect --bootstrap "$builder_name"

          docker buildx build \
            --builder "$builder_name" \
            --pull=false \
            --provenance=false \
            --build-arg MANAGER_SOURCE_REVISION="$MANAGER_SOURCE_REVISION" \
            --tag "$MANAGER_SECURITY_IMAGE" \
            --output "type=oci,dest=$oci_archive,oci-mediatypes=true" \
            --load \
            .

          image_id="$(docker image inspect --format '{{.Id}}' "$MANAGER_SECURITY_IMAGE")"
          test -n "$image_id"
          test -s "$oci_archive"
          echo "MANAGER_SECURITY_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "MANAGER_OCI_ARCHIVE=$oci_archive" >> "$GITHUB_ENV"

      - name: Generate and verify exact OCI build identity
        id: oci_build_identity
        continue-on-error: true
        run: |
          python scripts/oci_build_identity.py generate \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --oci-archive "$MANAGER_OCI_ARCHIVE" \
            --builder-image "$BUILDKIT_IMAGE" \
            --output security-artifacts/goreecloud-manager-oci-build-identity.json \
            --manifest-output security-artifacts/goreecloud-manager-oci-manifest.json
          python scripts/oci_build_identity.py verify \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --oci-archive "$MANAGER_OCI_ARCHIVE" \
            --builder-image "$BUILDKIT_IMAGE" \
            --input security-artifacts/goreecloud-manager-oci-build-identity.json \
            --manifest-input security-artifacts/goreecloud-manager-oci-manifest.json
          rm -f "$MANAGER_OCI_ARCHIVE"

      - name: Generate container image CycloneDX SBOM
        id: container_sbom
        continue-on-error: true
        run: |
          raw_sbom="security-artifacts/goreecloud-manager-image.unstamped.cdx.json"
          "$TRIVY_BIN" image \
            --disable-telemetry \
            --skip-version-check \
            --format cyclonedx \
            --output "$raw_sbom" \
            --timeout 5m \
            "$MANAGER_SECURITY_IMAGE"
          python scripts/container_supply_chain_security.py stamp-sbom \
            --input "$raw_sbom" \
            --output security-artifacts/goreecloud-manager-image.cdx.json \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --image-id "$MANAGER_SECURITY_IMAGE_ID" \
            --scanner-version "$TRIVY_VERSION"
          rm -f "$raw_sbom"

      - name: Scan container operating-system packages with Trivy
        id: trivy_scan
        continue-on-error: true
        run: |
          "$TRIVY_BIN" image \
            --disable-telemetry \
            --skip-version-check \
            --scanners vuln \
            --pkg-types os \
            --vuln-severity-source debian \
            --format json \
            --output security-artifacts/trivy-container-os-vulnerabilities.json \
            --timeout 5m \
            --exit-on-eol 2 \
            "$MANAGER_SECURITY_IMAGE"

      - name: Evaluate container operating-system vulnerability policy
        id: trivy_policy
        continue-on-error: true
        run: |
          python scripts/container_supply_chain_security.py evaluate \
            --input security-artifacts/trivy-container-os-vulnerabilities.json \
            --policy security/trivy-container-policy.json \
            --output security-artifacts/manager-container-os-vulnerability-summary.json \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --image-id "$MANAGER_SECURITY_IMAGE_ID" \
            --scanner-version "$TRIVY_VERSION"

      - name: Generate and verify exact release provenance evidence
        id: release_provenance
        continue-on-error: true
        run: |
          python scripts/release_provenance.py generate \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --output security-artifacts/goreecloud-manager-release-provenance.json \
            --material Dockerfile \
            --material requirements.txt \
            --material requirements.lock \
            --evidence security-artifacts/goreecloud-manager-oci-build-identity.json \
            --evidence security-artifacts/goreecloud-manager-oci-manifest.json \
            --evidence security-artifacts/goreecloud-manager-python.cdx.json \
            --evidence security-artifacts/osv-python-vulnerabilities.json \
            --evidence security-artifacts/goreecloud-manager-image.cdx.json \
            --evidence security-artifacts/trivy-container-os-vulnerabilities.json \
            --evidence security-artifacts/manager-container-os-vulnerability-summary.json
          python scripts/release_provenance.py verify \
            --image-reference "$MANAGER_SECURITY_IMAGE" \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --input security-artifacts/goreecloud-manager-release-provenance.json

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check

      - name: Install hash-locked desktop CI dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r desktop-client/requirements-ci.lock
          python -m pip check

      - name: Validate browser JavaScript
        run: node --check core/static/core/js/theme.js

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py collectstatic --noinput

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py check

      - name: Django deployment security check
        env:
          DJANGO_SECRET_KEY: ci-only-7C9pR2xV5mK8qL4nT6wH3sD1fG9jB2zX8uN5aM7eQ4rY6tP3cF
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py test

      - name: Upload supply-chain security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-supply-chain-security-${{ env.MANAGER_SOURCE_REVISION }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce supply-chain security evidence
        if: always()
        run: |
          failed=0
          if [ "${{ steps.osv_scan.outcome }}" != "success" ]; then
            echo "OSV Python vulnerability evidence did not pass."
            failed=1
          fi
          if [ "${{ steps.trivy_install.outcome }}" != "success" ]; then
            echo "Checksum-pinned Trivy installation did not pass."
            failed=1
          fi
          if [ "${{ steps.security_image.outcome }}" != "success" ]; then
            echo "Exact Manager image and OCI-layout build did not pass."
            failed=1
          fi
          if [ "${{ steps.oci_build_identity.outcome }}" != "success" ]; then
            echo "Exact loaded-image and OCI-layout identity evidence did not pass."
            failed=1
          fi
          if [ "${{ steps.container_sbom.outcome }}" != "success" ]; then
            echo "Container CycloneDX SBOM evidence did not pass."
            failed=1
          fi
          if [ "${{ steps.trivy_scan.outcome }}" != "success" ]; then
            echo "Trivy container operating-system scan did not pass."
            failed=1
          fi
          if [ "${{ steps.trivy_policy.outcome }}" != "success" ]; then
            echo "Container operating-system vulnerability policy did not pass."
            failed=1
          fi
          if [ "${{ steps.release_provenance.outcome }}" != "success" ]; then
            echo "Exact source/image release-provenance evidence did not pass."
            failed=1
          fi
          exit "$failed"
