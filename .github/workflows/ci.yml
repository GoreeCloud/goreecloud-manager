name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate browser JavaScript
        run: node --check core/static/core/js/theme.js

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py collectstatic --noinput

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py check

      - name: Django deployment security check
        env:
          DJANGO_SECRET_KEY: ci-only-7C9pR2xV5mK8qL4nT6wH3sD1fG9jB2zX8uN5aM7eQ4rY6tP3cF
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py test
