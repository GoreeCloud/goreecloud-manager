name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MANAGER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate Python dependency SBOM
        run: |
          mkdir -p security-artifacts
          python scripts/python_supply_chain_security.py sbom \
            --lock requirements.lock \
            --output security-artifacts/goreecloud-manager-python.cdx.json \
            --source-revision "$MANAGER_SOURCE_REVISION"

      - name: Scan locked Python dependencies with OSV
        id: osv_scan
        continue-on-error: true
        run: |
          python scripts/python_supply_chain_security.py scan \
            --lock requirements.lock \
            --policy security/osv-policy.json \
            --output security-artifacts/osv-python-vulnerabilities.json \
            --source-revision "$MANAGER_SOURCE_REVISION" \
            --timeout-seconds 10 \
            --attempts 2

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check

      - name: Validate browser JavaScript
        run: node --check core/static/core/js/theme.js

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py collectstatic --noinput

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py check

      - name: Django deployment security check
        env:
          DJANGO_SECRET_KEY: ci-only-7C9pR2xV5mK8qL4nT6wH3sD1fG9jB2zX8uN5aM7eQ4rY6tP3cF
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "false"
        run: python manage.py test

      - name: Upload supply-chain security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-supply-chain-security-${{ env.MANAGER_SOURCE_REVISION }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce OSV vulnerability evidence
        if: always()
        run: |
          if [ "${{ steps.osv_scan.outcome }}" != "success" ]; then
            echo "OSV vulnerability evidence did not pass."
            exit 1
          fi
