name: Runtime Publication Readiness

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-publication-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate hardened runtime and private publication
        run: bash scripts/validate_runtime_publication_readiness.sh
