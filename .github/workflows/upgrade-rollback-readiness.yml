name: Upgrade Rollback Readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  upgrade-rollback-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate previous-revision upgrade and backup-backed rollback
        run: bash scripts/validate_upgrade_rollback_readiness.sh
