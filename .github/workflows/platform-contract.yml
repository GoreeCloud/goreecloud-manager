name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Immutable integrated Platform Contract 0.2 revision aligned to current
    # Stable GLAZE UI V1.5 / 1.5.1, exactly seven Integral Platform Systems,
    # and separately governed GoreeCloud Sync.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@981c5807f249955e9f2c6c5d9136c9ed9c8017e9
    with:
      manifest-path: goreecloud.platform.yaml
