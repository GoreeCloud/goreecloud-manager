name: Client packaging

on:
  pull_request:
    paths:
      - 'android-client/**'
      - 'desktop-client/**'
      - 'packaging/**'
      - '.github/workflows/client-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-client-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-client
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Record APK checksum
        run: sha256sum android-client/app/build/outputs/apk/debug/app-debug.apk > android-client/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-manager-android-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            android-client/app/build/outputs/apk/debug/app-debug.apk
            android-client/app/build/outputs/apk/debug/app-debug.apk.sha256

  debian-package:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-pip python3-dev build-essential \
            patchelf dpkg-dev libgl1 libegl1 libdbus-1-3 libxkbcommon0 libxcb-cursor0
      - uses: actions/checkout@v4
      - name: Create isolated packaging environment
        run: |
          python3 -m venv /tmp/manager-build-venv
          /tmp/manager-build-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            -r desktop-client/requirements.txt pyinstaller==6.15.0
      - name: Build Debian package
        env:
          PATH: /tmp/manager-build-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: bash packaging/build-deb.sh
      - name: Inspect package metadata
        run: dpkg-deb --info dist/goreecloud-manager_0.2.7_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-manager-debian-amd64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/goreecloud-manager_0.2.7_amd64.deb
            dist/goreecloud-manager_0.2.7_amd64.deb.sha256
