name: Production Readiness Evidence Manifest

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  production-readiness-evidence-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate aggregate production-readiness evidence manifest
        run: python scripts/validate_manager_production_readiness_manifest.py --self-test
