name: Vendor Manager locked GLAZE UI V1.1 source

on:
  push:
    branches:
      - revamp/manager-glaze-v1.1-20260904
    paths:
      - 'core/static/core/glaze.lock.json'
      - 'scripts/vendor_glaze_v1_1.py'
      - '.github/workflows/vendor-glaze-v1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out Manager migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: revamp/manager-glaze-v1.1-20260904
      - name: Check out immutable GLAZE UI V1.1 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 15cc76d2bcd4065552dc31c77145b63f34d9e7b2
          path: .glaze-ui
          persist-credentials: false
      - name: Vendor and verify locked source graph
        run: python scripts/vendor_glaze_v1_1.py --source .glaze-ui
      - name: Commit vendored source when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- core/static/core/glaze)" ]]; then
            echo 'Vendored source already matches the immutable lock.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/static/core/glaze
          git commit -m 'Vendor locked GLAZE UI V1.1 source'
          git push origin HEAD:revamp/manager-glaze-v1.1-20260904
