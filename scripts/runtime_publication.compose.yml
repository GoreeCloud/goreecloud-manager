name: goreecloud-manager-runtime-publication

services:
  manager:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: manager.goreecloud.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://manager.goreecloud.com
      DJANGO_DB_PATH: /app/data/db.sqlite3
      NETBIRD_ENABLED: "false"
      HEALTHCHECKS_ENABLED: "false"
      UPTIME_KUMA_ENABLED: "false"
      BESZEL_ENABLED: "false"
      KOPIA_ENABLED: "false"
      TASKS_ENABLED: "false"
    secrets:
      - django_secret_key
      - admin_password
    volumes:
      - manager_data:/app/data
    expose:
      - "8000"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn goreecloud_manager.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request=urllib.request.Request('http://127.0.0.1:8000/readyz/', headers={'Host':'manager.goreecloud.com','X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      proxy:
        aliases:
          - goreecloud-manager

  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    depends_on:
      manager:
        condition: service_healthy
    volumes:
      - ./runtime_publication.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
      approved_ingress:
        aliases:
          - manager.goreecloud.com
      unapproved_ingress:
        aliases:
          - manager.goreecloud.com
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  approved-client:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./runtime_publication_client.py:/client.py:ro
      - caddy_data:/caddy-data:ro
    secrets:
      - admin_password
    networks:
      approved_ingress:
        ipv4_address: 100.100.0.10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  unapproved-client:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./runtime_publication_client.py:/client.py:ro
      - caddy_data:/caddy-data:ro
    networks:
      unapproved_ingress:
        ipv4_address: 172.30.245.10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  django_secret_key:
    file: ${MANAGER_RUNTIME_WORK_DIR}/django-secret-key
  admin_password:
    file: ${MANAGER_RUNTIME_WORK_DIR}/admin-password

volumes:
  manager_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.246.0/24
  approved_ingress:
    internal: true
    ipam:
      config:
        - subnet: 100.100.0.0/24
  unapproved_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.245.0/24
