name: goreecloud-manager-monitoring-alert

services:
  manager:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: manager.goreecloud.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://manager.goreecloud.com
      DJANGO_DB_PATH: /app/data/db.sqlite3
      NETBIRD_ENABLED: "false"
      HEALTHCHECKS_ENABLED: "false"
      UPTIME_KUMA_ENABLED: "false"
      BESZEL_ENABLED: "false"
      KOPIA_ENABLED: "false"
      TASKS_ENABLED: "false"
    secrets:
      - django_secret_key
    volumes:
      - manager_data:/app/data
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn goreecloud_manager.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':'manager.goreecloud.com','X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      proxy:
        aliases:
          - goreecloud-manager

  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    depends_on:
      manager:
        condition: service_healthy
    volumes:
      - ./monitoring_alert.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        aliases:
          - manager.goreecloud.com
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ntfy:
    image: binwiederhier/ntfy:v2.26.3@sha256:081b53dbb20674fcfe05fdb4eb8af9036a2645ef979543d16f7f80803af467b1
    command:
      - serve
    user: "1001:1001"
    volumes:
      - ${MANAGER_MONITORING_WORK_DIR}/ntfy-server.yml:/etc/ntfy/server.yml:ro
    tmpfs:
      - /var/lib/ntfy:rw,nosuid,nodev,noexec,size=64m,uid=1001,gid=1001,mode=0700
    networks:
      proxy:
        aliases:
          - ntfy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  monitor:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./monitoring_alert_client.py:/client.py:ro
      - caddy_data:/caddy-data:ro
    secrets:
      - ntfy_publisher_token
    networks:
      proxy:
        ipv4_address: 172.19.0.50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  subscriber:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./monitoring_alert_client.py:/client.py:ro
    secrets:
      - ntfy_subscriber_token
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  django_secret_key:
    file: ${MANAGER_MONITORING_WORK_DIR}/django-secret-key
  ntfy_publisher_token:
    file: ${MANAGER_MONITORING_WORK_DIR}/ntfy-publisher-token
  ntfy_subscriber_token:
    file: ${MANAGER_MONITORING_WORK_DIR}/ntfy-subscriber-token

volumes:
  manager_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.19.0.0/24
